assertions:
  - name: "issue title was updated"
    command: "curl -sf http://localhost:$PORT/api/issues/ab12-editable-issue | jq -r '.frontmatter.title'"
    stdout: "Edited issue\n"
    services:
      - command: "clc-api serve --port 0 --root ."

  - name: "issue status was updated"
    command: "curl -sf http://localhost:$PORT/api/issues/ab12-editable-issue | jq -r '.frontmatter.status'"
    stdout: "in_progress\n"
    services:
      - command: "clc-api serve --port 0 --root ."

  - name: "label was added"
    command: "curl -sf http://localhost:$PORT/api/issues/ab12-editable-issue | jq -r '.frontmatter.labels | join(\",\")'"
    stdout: "original,edited\n"
    services:
      - command: "clc-api serve --port 0 --root ."
