assertions:
  - name: "state file exists"
    command: "test -f .clc/state"

  - name: "status reports phase red"
    command: "clc status 2>&1 | grep 'phase: red'"

  - name: "status set skipping to green is rejected"
    command: "clc status set green 2>&1; test $? -ne 0"

  - name: "prime does not include authoring detail"
    command: "! clc prime | grep 'missouri.yml'"

  - name: "prime shows current phase"
    command: "clc prime | grep 'red'"

transitions:
  - name: "advance to implementing"
    command: "clc status set implementing"
    target: "../phase-implementing"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc"
          ignore: true

  - name: "go back to tests-written"
    command: "clc status set tests-written"
    target: "../phase-tests-written"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc"
          ignore: true
