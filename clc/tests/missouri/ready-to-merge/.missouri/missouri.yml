assertions:
  - name: "on main branch"
    command: "test $(git rev-parse --abbrev-ref HEAD) = main"

  - name: "feature branch exists"
    command: "git branch --list test-feature | grep -q test-feature"

  - name: "merge fails when not on main"
    command: "git checkout -q test-feature && clc merge test-feature 2>&1; RET=$?; git checkout -q main; test $RET -ne 0"

  - name: "merge fails for non-existent branch"
    command: "clc merge no-such-branch 2>&1; test $? -ne 0"

  - name: "merge fails when branch is not finalized"
    command: "git branch not-finalized main && clc merge not-finalized 2>&1; RET=$?; git branch -D not-finalized >/dev/null 2>&1; test $RET -ne 0"

  - name: "merge fails with uncommitted changes"
    command: "echo dirty >> Cargo.toml && clc merge test-feature 2>&1; RET=$?; git checkout -q -- Cargo.toml; test $RET -ne 0"

  - name: "merge failure message is descriptive"
    command: "clc merge no-such-branch 2>&1 | grep -qi 'branch\\|not found'"

transitions:
  - name: "merge feature branch"
    command: "clc merge test-feature"
    target: "../merged"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc/"
          ignore: true
        - path: ".git/"
          ignore: true
        - path: ".tisket/"
          ignore: true
        - path: "tisket.yml"
          ignore: true
        - path: "tests/"
          ignore: true
