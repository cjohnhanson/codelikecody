assertions:
  - name: "still on main after merge"
    command: "test $(git rev-parse --abbrev-ref HEAD) = main"

  - name: "feature branch commits are on main"
    command: "git log --oneline main | grep -q init"

  - name: "feature branch was cleaned up"
    command: "! git branch --list test-feature | grep -q test-feature"

  - name: "merge of deleted branch fails gracefully"
    command: "clc merge test-feature 2>&1; test $? -ne 0"

  - name: "merge failure mentions branch not found"
    command: "clc merge test-feature 2>&1 | grep -qi 'not found'"
