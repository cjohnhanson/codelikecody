assertions:
  - name: ".clc directory exists"
    command: "test -d .clc"

  - name: ".claude directory exists"
    command: "test -d .claude"

  - name: "settings.local.json exists"
    command: "test -f .claude/settings.local.json"

  - name: "settings.local.json is valid JSON"
    command: "jq empty .claude/settings.local.json"

  - name: "hooks object has 14 events"
    command: "test $(jq '.hooks | keys | length' .claude/settings.local.json) -eq 14"

  - name: ".git/info/exclude exists"
    command: "test -f .git/info/exclude"

  - name: "exclude contains .clc/"
    command: "grep -qx '.clc/' .git/info/exclude"

  - name: "exclude contains .claude/settings.local.json"
    command: "grep -qx '.claude/settings.local.json' .git/info/exclude"

  - name: "exclude contains tisket.yml"
    command: "grep -qx 'tisket.yml' .git/info/exclude"

  - name: "exclude contains .tisket/"
    command: "grep -qx '.tisket/' .git/info/exclude"

  - name: "git status does not show .clc as untracked"
    command: "! git status --porcelain | grep -q '.clc'"

  - name: "git status does not show .claude as untracked"
    command: "! git status --porcelain | grep -q '.claude'"

  - name: ".clc/state does not record untracked mode"
    command: "! grep -q 'untracked: true' .clc/state 2>/dev/null"

  - name: "status reports untracked true"
    command: "clc status 2>&1 | grep 'untracked: true'"

  - name: "status reports initialized true"
    command: "clc status 2>&1 | grep 'initialized: true'"
