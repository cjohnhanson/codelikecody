assertions:
  - name: "worker directory is gone after prune"
    command: "! test -d .worktrees/test-feature/.clc/worker"

  - name: "worktree itself still exists"
    command: "test -d .worktrees/test-feature"

  - name: "coordinator cursor dir is cleaned up"
    command: "! test -d .clc/workers/test-feature"

  - name: "clc workers shows no dead worker by default"
    command: "! clc workers 2>&1 | grep -q test-feature"

  - name: "clc workers --all also shows no pruned worker"
    command: "! clc workers --all 2>&1 | grep -q test-feature"

  - name: "git branch still exists after prune"
    command: "git branch --list test-feature | grep -q test-feature"
