assertions:
  # --- Config parsing ---
  - name: "clc config show succeeds with workflow policy config"
    command: "clc config show"

  - name: "clc config show contains workflows section"
    command: "clc config show | grep -q 'workflows'"

  - name: "clc config show contains rules section"
    command: "clc config show | grep -q 'rules'"

  - name: "docs-task exists with docs label"
    command: "grep -q 'labels:.*docs' .tisket/v0.1.0/docs-task.md"

  - name: "feature-task exists with feature label"
    command: "grep -q 'labels:.*feature' .tisket/v0.1.0/feature-task.md"

  - name: "docs-task is in todo status"
    command: "grep -q 'status: todo' .tisket/v0.1.0/docs-task.md"

  - name: "feature-task is in todo status"
    command: "grep -q 'status: todo' .tisket/v0.1.0/feature-task.md"

transitions:
  - name: "pickup docs-task (lightweight workflow)"
    command: "clc pickup docs-task"
    target: "../picked-up-lightweight"
    comparators:
      files:
        - path: ".claude/"
          ignore: true
        - path: ".clc/"
          ignore: true
        - path: ".git/"
          ignore: true
        - path: ".worktrees/"
          ignore: true
        - path: ".tisket/"
          ignore: true
        - path: "tisket.yml"
          ignore: true
        - path: "clc.toml"
          ignore: true
