assertions:
  - name: "on main branch"
    command: "test $(git rev-parse --abbrev-ref HEAD) = main"

  - name: "feature branch exists"
    command: "git branch --list test-feature | grep -q test-feature"

  - name: "main has diverged from feature branch"
    command: "! git merge-base --is-ancestor $(git rev-parse HEAD) $(git rev-parse test-feature)"

  - name: "CHANGELOG.md exists on main"
    command: "test -f CHANGELOG.md"

transitions:
  - name: "merge feature branch with auto-rebase"
    command: "clc merge test-feature"
    target: "../merged-after-rebase"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc/"
          ignore: true
        - path: ".git/"
          ignore: true
        - path: ".tisket/"
          ignore: true
        - path: "tisket.yml"
          ignore: true
        - path: "tests/"
          ignore: true
