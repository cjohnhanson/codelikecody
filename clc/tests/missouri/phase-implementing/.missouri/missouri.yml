assertions:
  - name: "state file exists"
    command: "test -f .clc/state"

  - name: "status reports phase implementing"
    command: "clc status 2>&1 | grep 'phase: implementing'"

  - name: "phase guard allows Edit in src on feature branch"
    command: "git init -q -b main && git -c user.name=t -c user.email=t@t commit -q --allow-empty -m init && git checkout -q -B feat-xyz && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Edit\",\"tool_input\":{\"file_path\":\"src/main.rs\"}}' | clc hook"

  - name: "phase guard allows Edit in tests/missouri on feature branch"
    command: "git init -q -b main && (git checkout -B feat-xyz 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Edit\",\"tool_input\":{\"file_path\":\"tests/missouri/foo/.missouri/missouri.yml\"}}' | clc hook"

  - name: "phase guard allows Write to Cargo.toml on feature branch"
    command: "git init -q -b main && (git checkout -B feat-xyz 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Write\",\"tool_input\":{\"file_path\":\"Cargo.toml\"}}' | clc hook"

  - name: "phase guard allows NotebookEdit on feature branch"
    command: "git init -q -b main && (git checkout -B feat-xyz 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"NotebookEdit\",\"tool_input\":{\"file_path\":\"notebook.ipynb\"}}' | clc hook"

  - name: "phase guard allows Bash on feature branch"
    command: "git init -q -b main && (git checkout -B feat-xyz 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"cargo test\"}}' | clc hook"

  - name: "prime is lean — no authoring detail"
    command: "! clc prime | grep 'missouri.yml'"

  - name: "prime directive mentions running tests"
    command: "clc prime | grep -i 'test'"

  - name: "prime shows current phase"
    command: "clc prime | grep 'implementing'"

  - name: "prime includes TDD mandate"
    command: "clc prime | grep -i 'test-driven'"

  - name: "prime TDD mandate is independent of phase"
    command: "clc prime | grep -i 'not a phase system'"

  - name: "Stop hook blocked in implementing"
    command: "git init -q -b main && git -c user.name=t -c user.email=t@t commit -q --allow-empty -m init && git checkout -q -B feat-xyz && echo '{\"hook_event_name\":\"Stop\",\"session_id\":\"test\",\"cwd\":\".\"}' | clc hook 2>/dev/null; test $? -eq 2"

  - name: "UserPromptSubmit reinforcement shows phase"
    command: "echo '{\"hook_event_name\":\"UserPromptSubmit\",\"session_id\":\"test\",\"cwd\":\".\",\"prompt\":\"hello\"}' | clc hook | jq -r '.hookSpecificOutput.additionalContext' | grep 'implementing'"

  - name: "PostToolUse Edit returns nudge in implementing"
    command: "echo '{\"hook_event_name\":\"PostToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Edit\",\"tool_input\":{},\"tool_response\":{}}' | clc hook | jq -e '.hookSpecificOutput.additionalContext'"

  - name: "PostToolUse nudge mentions tests"
    command: "echo '{\"hook_event_name\":\"PostToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Edit\",\"tool_input\":{},\"tool_response\":{}}' | clc hook | jq -r '.hookSpecificOutput.additionalContext' | grep -i 'test'"

  - name: "PostToolUse Read produces no output in implementing"
    command: "OUTPUT=$(echo '{\"hook_event_name\":\"PostToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Read\",\"tool_input\":{},\"tool_response\":{}}' | clc hook); test -z \"$OUTPUT\""

transitions:
  - name: "advance to green"
    command: "clc status set green"
    target: "../phase-green"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc"
          ignore: true

  - name: "go back to red"
    command: "clc status set red"
    target: "../phase-red"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc"
          ignore: true
