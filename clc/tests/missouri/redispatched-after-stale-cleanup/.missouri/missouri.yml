assertions:
  - name: "worktree directory exists after stale cleanup"
    command: "test -d .worktrees/test-feature"

  - name: "git branch exists after stale cleanup"
    command: "git branch --list test-feature | grep -q test-feature"

  - name: "worker PID file exists"
    command: "test -f .worktrees/test-feature/.clc/worker/pid"

  - name: "worker PID is a number"
    command: "grep -qE '^[0-9]+$' .worktrees/test-feature/.clc/worker/pid"

  - name: "worker is alive"
    command: "kill -0 $(cat .worktrees/test-feature/.clc/worker/pid)"

  - name: "new PID differs from old dead PID"
    command: "test $(cat .worktrees/test-feature/.clc/worker/pid) -ne $(cat /tmp/missouri-stale-old-pid)"

  - name: "tisket status is in_progress"
    command: "grep -q 'status: in_progress' .tisket/v0.1.0/test-feature.md"

  - name: "still on main after re-dispatch"
    command: "test $(git rev-parse --abbrev-ref HEAD) = main"

  - name: "worker stdout file exists"
    command: "test -f .worktrees/test-feature/.clc/worker/stdout.jsonl"

  - name: "worker stdin pipe exists"
    command: "test -p .worktrees/test-feature/.clc/worker/stdin.pipe"

  - name: "clc workers shows the re-dispatched worker"
    command: "clc workers | grep -q test-feature"
