assertions:
  - name: "phase is green"
    command: "clc status 2>&1 | grep 'phase: green'"

  - name: "on feature branch"
    command: "test $(git rev-parse --abbrev-ref HEAD) = test-feature"

  - name: "tisket is in_progress"
    command: "grep -q 'status: in_progress' .tisket/v0.1.0/test-feature.md"

  - name: "missouri tests pass"
    command: "clc status 2>&1 | grep 'missouri: 1/1 passing'"

  - name: "done rejects green phase (review required)"
    command: "clc done 2>&1; test $? -ne 0"

  - name: "done rejection message mentions terminal or current phase"
    command: "OUT=$(clc done 2>&1); test $? -ne 0 && echo \"$OUT\" | grep -iE 'terminal|green'"

  - name: "prime includes all three sections"
    command: "clc prime | grep -i 'workflow' && clc prime | grep -i 'tisket' && clc prime | grep -i 'missouri'"

  - name: "prime includes issue details on matching branch"
    command: "clc prime | grep 'Test feature'"

  - name: "prime mentions finalize or done"
    command: "clc prime | grep -iE 'done|finalize'"

  - name: "prime mentions updating scratch"
    command: "clc prime | grep -i 'scratch'"

  - name: "prime instructs workers to commit before clc done"
    command: "clc prime | grep -iE 'commit.*before.*clc done|commit.*before.*finaliz'"

  - name: "SessionStart hook includes full prime"
    command: "echo '{\"hook_event_name\":\"SessionStart\",\"session_id\":\"test\",\"cwd\":\".\",\"source\":\"startup\"}' | clc hook | jq -r '.hookSpecificOutput.additionalContext' | grep -i 'tisket' && echo '{\"hook_event_name\":\"SessionStart\",\"session_id\":\"test\",\"cwd\":\".\",\"source\":\"startup\"}' | clc hook | jq -r '.hookSpecificOutput.additionalContext' | grep -i 'missouri'"

  - name: "Stop hook blocked in green on feature branch"
    command: "echo '{\"hook_event_name\":\"Stop\",\"session_id\":\"test\",\"cwd\":\".\"}' | clc hook 2>/dev/null; test $? -eq 2"

transitions:
  - name: "advance through review chain to done"
    command: "clc status set review-requested && clc status set in-review && clc status set reviewed && clc status set done"
    target: "../ready-to-done-via-review"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc/"
          ignore: true
        - path: ".git/"
          ignore: true
        - path: ".tisket/"
          ignore: true
        - path: "tisket.yml"
          ignore: true
        - path: "tests/"
          ignore: true
