doc: |
  Source files are locked. The agent can read anything and run commands,
  but Edit, Write, and NotebookEdit are rejected for anything outside
  `tests/missouri/`. The stop hook blocks too — the agent can't bail
  until it reaches `review-requested`.

  Skipping ahead doesn't work. `clc status set red` is rejected —
  phases advance one step at a time.

assertions:
  - name: "state file exists"
    command: "test -f .clc/state"

  - name: "status reports phase tests-unwritten"
    command: "clc status 2>&1 | grep 'phase: tests-unwritten'"

  - name: "status set to same phase is rejected"
    command: "clc status set tests-unwritten 2>&1; test $? -ne 0"

  - name: "status set to unknown phase is rejected"
    command: "clc status set bogus-phase 2>&1; test $? -ne 0"

  - name: "status set skipping ahead to red is rejected"
    command: "clc status set red 2>&1; test $? -ne 0"

  - name: "status set skipping to green is rejected"
    command: "clc status set green 2>&1; test $? -ne 0"

  - name: "phase guard allows Edit in tests/missouri on feature branch"
    command: "git init -q -b main && git -c user.name=t -c user.email=t@t commit -q --allow-empty -m init && git checkout -q -B feat-xyz && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Edit\",\"tool_input\":{\"file_path\":\"tests/missouri/foo/.missouri/missouri.yml\"}}' | clc hook"

  - name: "phase guard blocks Edit in src on feature branch"
    command: "git init -q -b main && (git checkout -B feat-xyz 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Edit\",\"tool_input\":{\"file_path\":\"src/main.rs\"}}' | clc hook 2>/dev/null; test $? -eq 2"

  - name: "phase guard blocks Write to Cargo.toml on feature branch"
    command: "git init -q -b main && (git checkout -B feat-xyz 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Write\",\"tool_input\":{\"file_path\":\"Cargo.toml\"}}' | clc hook 2>/dev/null; test $? -eq 2"

  - name: "phase guard blocks NotebookEdit in src on feature branch"
    command: "git init -q -b main && (git checkout -B feat-xyz 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"NotebookEdit\",\"tool_input\":{\"file_path\":\"notebook.ipynb\"}}' | clc hook 2>/dev/null; test $? -eq 2"

  - name: "phase guard allows Read anywhere on feature branch"
    command: "git init -q -b main && (git checkout -B feat-xyz 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Read\",\"tool_input\":{\"file_path\":\"src/main.rs\"}}' | clc hook"

  - name: "phase guard allows Bash on feature branch"
    command: "git init -q -b main && (git checkout -B feat-xyz 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"cargo test\"}}' | clc hook"

  - name: "prime includes missouri authoring detail"
    command: "clc prime | grep 'missouri.yml'"

  - name: "prime includes directory structure"
    command: "clc prime | grep 'tests/missouri'"

  - name: "prime directive says write tests"
    command: "clc prime | grep -i 'write test'"

  - name: "prime shows current phase"
    command: "clc prime | grep 'tests-unwritten'"

  - name: "prime includes state graph concepts"
    command: "clc prime | grep -i 'transition'"

  - name: "prime does not include implementing directive"
    command: "! clc prime | grep -i 'fix failing'"

  - name: "prime includes TDD mandate"
    command: "clc prime | grep -i 'test-driven'"

  - name: "prime TDD mandate is independent of phase"
    command: "clc prime | grep -i 'not a phase system'"

  - name: "prime instructs workers to commit before clc done"
    command: "clc prime | grep -iE 'commit.*before.*clc done|commit.*before.*finaliz'"

  - name: "Stop hook blocked in tests-unwritten"
    command: "git init -q -b main && git -c user.name=t -c user.email=t@t commit -q --allow-empty -m init && git checkout -q -B feat-xyz && echo '{\"hook_event_name\":\"Stop\",\"session_id\":\"test\",\"cwd\":\".\"}' | clc hook 2>/dev/null; test $? -eq 2"

  - name: "Stop block message mentions completing work"
    command: "git init -q -b main && git -c user.name=t -c user.email=t@t commit -q --allow-empty -m init && git checkout -q -B feat-xyz && echo '{\"hook_event_name\":\"Stop\",\"session_id\":\"test\",\"cwd\":\".\"}' | clc hook 2>&1 >/dev/null | grep -iE 'done|complete'"

  - name: "PostToolUse Edit passes through in tests-unwritten"
    command: "echo '{\"hook_event_name\":\"PostToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Edit\",\"tool_input\":{},\"tool_response\":{}}' | clc hook"

transitions:
  - name: "advance to tests-written"
    command: "clc status set tests-written"
    target: "../phase-tests-written"
    doc: |
      Tests exist. The guard doesn't verify this — it trusts the
      transition. Verification happens at `red`, when the tests
      need to actually fail.
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc"
          ignore: true
