assertions:
  - name: "phase is done"
    command: "clc status 2>&1 | grep 'phase: done'"

  - name: "on feature branch"
    command: "test $(git rev-parse --abbrev-ref HEAD) = test-feature"

  - name: "tisket is still in_progress"
    command: "grep -q 'status: in_progress' .tisket/v0.1.0/test-feature.md"

transitions:
  - name: "finalize work"
    command: "clc done"
    target: "../done-completed-pickup-style"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc/"
          ignore: true
        - path: ".git/"
          ignore: true
        - path: ".tisket/"
          ignore: true
        - path: "tisket.yml"
          ignore: true
        - path: "tests/"
          ignore: true
