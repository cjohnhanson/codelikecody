assertions:
  - name: "clc.yml exists with skills config"
    command: "test -f clc.yml && grep -q 'skills:' clc.yml"

  - name: "skill directories exist with SKILL.md files"
    command: "test -f skills/test-skill/SKILL.md && test -f skills/another-skill/SKILL.md"

  - name: "prime includes skills section header"
    command: "clc prime | grep -i 'Almanac (skills)'"

  - name: "prime lists test-skill with description"
    command: "clc prime | grep 'test-skill' | grep 'A test skill for validation'"

  - name: "prime lists another-skill with description"
    command: "clc prime | grep 'another-skill' | grep 'Another skill for testing'"

  - name: "prime includes file path for skill retrieval"
    command: "clc prime | grep 'test-skill' | grep 'file:'"

  - name: "SessionStart hook output includes skill index"
    command: "echo '{\"hook_event_name\":\"SessionStart\",\"session_id\":\"test\",\"cwd\":\".\",\"source\":\"startup\"}' | clc hook | jq -r '.hookSpecificOutput.additionalContext' | grep -i 'Almanac (skills)'"

  - name: "SessionStart hook output lists both skills"
    command: "echo '{\"hook_event_name\":\"SessionStart\",\"session_id\":\"test\",\"cwd\":\".\",\"source\":\"startup\"}' | clc hook | jq -r '.hookSpecificOutput.additionalContext' | grep 'test-skill' && echo '{\"hook_event_name\":\"SessionStart\",\"session_id\":\"test\",\"cwd\":\".\",\"source\":\"startup\"}' | clc hook | jq -r '.hookSpecificOutput.additionalContext' | grep 'another-skill'"

  - name: "almanac list shows both skills"
    command: "clc almanac list | grep 'test-skill' && clc almanac list | grep 'another-skill'"

  - name: "almanac list shows source type"
    command: "clc almanac list | grep '\\[file\\]'"

  - name: "almanac show prints full SKILL.md content"
    command: "clc almanac show test-skill | grep '# Test Skill'"

  - name: "almanac show unknown skill fails"
    command: "! clc almanac show nonexistent 2>/dev/null"

  - name: "prime without skills config has no skills section"
    command: "rm clc.yml && ! clc prime | grep -i 'Almanac (skills)'"
