assertions:
  - name: "worktree directory exists"
    command: "test -d .worktrees/test-feature"

  - name: "git branch exists"
    command: "git branch --list test-feature | grep -q test-feature"

  - name: "worktree is on correct branch"
    command: "cd .worktrees/test-feature && test $(git rev-parse --abbrev-ref HEAD) = test-feature"

  - name: "tisket status changed to in_progress"
    command: "grep -q 'status: in_progress' .tisket/v0.1.0/test-feature.md"

  - name: "worktree has .clc directory"
    command: "test -d .worktrees/test-feature/.clc"

  - name: "worktree has settings.local.json"
    command: "test -f .worktrees/test-feature/.claude/settings.local.json"

  - name: "worktree phase is tests-unwritten"
    command: "cd .worktrees/test-feature && clc status 2>&1 | grep 'phase: tests-unwritten'"

  - name: "still on main after pickup"
    command: "test $(git rev-parse --abbrev-ref HEAD) = main"
