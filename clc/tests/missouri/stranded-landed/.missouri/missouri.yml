assertions:
  - name: "still on main after land"
    command: "test $(git rev-parse --abbrev-ref HEAD) = main"

  - name: "feature branch commits are on main"
    command: "git log --oneline main | grep -q 'add tests and implementation'"

  - name: "finalize commit is on main"
    command: "git log --oneline main | grep -q 'clc: finalize'"

  - name: "feature branch was cleaned up"
    command: "! git branch --list test-feature | grep -q test-feature"

  - name: "worktree was cleaned up"
    command: "! test -d .worktrees/test-feature"

  - name: "working tree is clean after land"
    command: "test -z \"$(git status --porcelain -uno)\""

  - name: "closed tisket exists on main after land"
    command: "test -f .tisket/v0.1.0/.closed/test-feature.md"

  - name: "open tisket is absent from main after land"
    command: "! test -f .tisket/v0.1.0/test-feature.md"

  - name: "clc workers --stranded shows nothing after land"
    command: "! clc workers --stranded 2>&1 | grep -q test-feature"
