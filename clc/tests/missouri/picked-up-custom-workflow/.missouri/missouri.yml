assertions:
  - name: "worktree directory exists"
    command: "test -d .worktrees/write-docs"

  - name: "git branch exists"
    command: "git branch --list write-docs | grep -q write-docs"

  - name: "tisket status changed to in_progress"
    command: "grep -q 'status: in_progress' .tisket/v0.1.0/write-docs.md"

  - name: "worktree phase is outline (custom workflow initial phase)"
    command: "cd .worktrees/write-docs && clc status 2>&1 | grep 'phase: outline'"

  - name: "workflow name stored in state"
    command: "grep -q 'workflow: docs' .worktrees/write-docs/.clc/state"

  - name: "phase is NOT tests-unwritten (would be wrong workflow)"
    command: "cd .worktrees/write-docs && ! clc status 2>&1 | grep 'tests-unwritten'"

  - name: "status set to draft succeeds (valid transition)"
    command: "cd .worktrees/write-docs && clc status set draft"

  - name: "phase is now draft"
    command: "cd .worktrees/write-docs && clc status 2>&1 | grep 'phase: draft'"

  - name: "status set to done is blocked (requires docs-review)"
    command: "cd .worktrees/write-docs && clc status set done 2>&1; test $? -ne 0"

  - name: "status set to implementing is rejected (not in this workflow)"
    command: "cd .worktrees/write-docs && clc status set implementing 2>&1; test $? -ne 0"

  - name: "status set back to outline succeeds (backward transition)"
    command: "cd .worktrees/write-docs && clc status set outline"

  - name: "phase guard blocks Edit to src/ in outline phase"
    command: >-
      cd .worktrees/write-docs &&
      git init -q -b main 2>/dev/null;
      (git checkout -B write-docs 2>/dev/null || true) &&
      echo '{"hook_event_name":"PreToolUse","session_id":"test","cwd":".","tool_name":"Edit","tool_input":{"file_path":"src/main.rs"}}' | clc hook 2>/dev/null;
      test $? -eq 2

  - name: "phase guard allows Edit to docs/ in outline phase"
    command: >-
      cd .worktrees/write-docs &&
      clc status set outline 2>/dev/null;
      echo '{"hook_event_name":"PreToolUse","session_id":"test","cwd":".","tool_name":"Edit","tool_input":{"file_path":"docs/guide.md"}}' | clc hook

  - name: "prime text includes workflow description"
    command: "cd .worktrees/write-docs && clc prime | grep -i 'documentation'"

  - name: "prime text includes phase list"
    command: "cd .worktrees/write-docs && clc prime | grep 'outline.*draft.*done'"
