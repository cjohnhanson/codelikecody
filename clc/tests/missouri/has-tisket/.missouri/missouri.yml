assertions:
  - name: "status reports tisket with open count"
    command: "clc status 2>&1 | grep 'tisket:.*open'"

  - name: "status reports tisket issue on matching branch"
    command: "git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B test-feature && clc status 2>&1 | grep 'tisket_issue: test-feature'"

  - name: "status reports tisket title on matching branch"
    command: "git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B test-feature && clc status 2>&1 | grep 'tisket_title: Test feature'"

  - name: "status reports no tisket issue when branch does not match"
    command: "git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B unrelated-branch && ! clc status 2>&1 | grep 'tisket_issue:'"

  - name: "prime includes tisket orientation"
    command: "clc prime | grep -i 'issue tracker'"

  - name: "prime includes issue details when branch matches"
    command: "git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B test-feature && clc prime | grep 'Test feature'"

  - name: "prime shows open count when branch does not match"
    command: "git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B unrelated-branch && clc prime | grep -i 'open'"

  - name: "prime includes tisket commands"
    command: "clc prime | grep 'tisket issue'"

  - name: "clc tisket issue list shows test issue"
    command: "clc tisket issue list | grep 'Test feature'"

  - name: "UserPromptSubmit reinforcement shows tisket"
    command: "echo '{\"hook_event_name\":\"UserPromptSubmit\",\"session_id\":\"test\",\"cwd\":\".\",\"prompt\":\"hello\"}' | clc hook | jq -r '.hookSpecificOutput.additionalContext' | grep -i 'tisket'"

  - name: "SessionStart bootstraps phase on unphased feature branch with matching tisket"
    command: "rm -f .clc/state && git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B test-feature && echo '{\"hook_event_name\":\"SessionStart\",\"session_id\":\"test\",\"cwd\":\".\",\"source\":\"startup\"}' | clc hook > /dev/null && test -f .clc/state && grep 'tests-unwritten' .clc/state"

  - name: "SessionStart does not bootstrap phase on main"
    command: "rm -f .clc/state && rm -rf .git && git init -q -b main && echo '{\"hook_event_name\":\"SessionStart\",\"session_id\":\"test\",\"cwd\":\".\",\"source\":\"startup\"}' | clc hook > /dev/null && ! test -f .clc/state"

  - name: "SessionStart does not bootstrap phase when no matching tisket"
    command: "rm -f .clc/state && rm -rf .git && git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B unrelated-branch && echo '{\"hook_event_name\":\"SessionStart\",\"session_id\":\"test\",\"cwd\":\".\",\"source\":\"startup\"}' | clc hook > /dev/null && ! test -f .clc/state"

  - name: "SessionStart does not overwrite existing phase"
    command: "rm -f .clc/state && rm -rf .git && git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B test-feature && clc status set tests-unwritten && clc status set tests-written && echo '{\"hook_event_name\":\"SessionStart\",\"session_id\":\"test\",\"cwd\":\".\",\"source\":\"startup\"}' | clc hook > /dev/null && grep 'tests-written' .clc/state"
