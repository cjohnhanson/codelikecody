assertions:
  - name: "on main branch"
    command: "test $(git rev-parse --abbrev-ref HEAD) = main"

  - name: "feature branch exists"
    command: "git branch --list test-feature | grep -q test-feature"

  - name: "open tisket is on main before merge"
    command: "test -f .tisket/v0.1.0/test-feature.md"

  - name: "main working tree is clean before merge"
    command: "test -z \"$(git status --porcelain -uno)\""

transitions:
  - name: "merge feature branch"
    command: "clc merge test-feature"
    target: "../merged-pickup-style"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc/"
          ignore: true
        - path: ".git/"
          ignore: true
        - path: ".tisket/"
          ignore: true
        - path: "tisket.yml"
          ignore: true
        - path: "tests/"
          ignore: true
