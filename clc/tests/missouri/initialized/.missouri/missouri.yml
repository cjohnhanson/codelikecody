entrypoint: true

assertions:
  - name: ".clc directory exists"
    command: "test -d .clc"

  - name: ".claude directory exists"
    command: "test -d .claude"

  - name: "settings.local.json exists"
    command: "test -f .claude/settings.local.json"

  - name: "settings.local.json is valid JSON"
    command: "jq empty .claude/settings.local.json"

  - name: "hooks object has 14 events"
    command: "test $(jq '.hooks | keys | length' .claude/settings.local.json) -eq 14"

  - name: "SessionStart hook is wired"
    command: "jq -e '.hooks.SessionStart' .claude/settings.local.json"

  - name: "PreToolUse hook is wired"
    command: "jq -e '.hooks.PreToolUse' .claude/settings.local.json"

  - name: "Stop hook is wired"
    command: "jq -e '.hooks.Stop' .claude/settings.local.json"

  - name: "config show prints defaults when no config file"
    command: "clc config show 2>&1 | grep 'main_branch: main'"

  - name: "config show exits 0 with no config file"
    command: "clc config show"

  - name: "hook handles SessionStart and produces JSON output"
    command: "echo '{\"hook_event_name\":\"SessionStart\",\"session_id\":\"test\",\"cwd\":\"/tmp\",\"source\":\"startup\"}' | clc hook | jq -e '.hookSpecificOutput.hookEventName == \"SessionStart\"'"

  - name: "hook SessionStart includes additionalContext"
    command: "echo '{\"hook_event_name\":\"SessionStart\",\"session_id\":\"test\",\"cwd\":\"/tmp\",\"source\":\"startup\"}' | clc hook | jq -e '.hookSpecificOutput.additionalContext'"

  - name: "hook PreToolUse Read passes through (exit 0)"
    command: "echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\"/tmp\",\"tool_name\":\"Read\",\"tool_input\":{\"file_path\":\"/tmp/foo\"}}' | clc hook"

  - name: "hook PreToolUse Bash passes through when not in git repo"
    command: "echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\"/tmp\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"ls\"}}' | clc hook"

  - name: "hook exits non-zero on invalid JSON stdin"
    command: "echo 'not json' | clc hook; test $? -ne 0"

  - name: "hook handles unknown event gracefully (exit 0)"
    command: "echo '{\"hook_event_name\":\"FutureEvent\",\"session_id\":\"test\",\"cwd\":\"/tmp\"}' | clc hook"

  - name: "status reports initialized true"
    command: "clc status 2>&1 | grep 'initialized: true'"

  - name: "status reports default main_branch"
    command: "clc status 2>&1 | grep 'main_branch: main'"

  - name: "status reports branch on main"
    command: "git init -q -b main && clc status 2>&1 | grep 'branch: main'"

  - name: "status reports is_main true on main"
    command: "git init -q -b main && clc status 2>&1 | grep 'is_main: true'"

  - name: "status reports is_main true on master"
    command: "git init -q -b master && clc status 2>&1 | grep 'is_main: true'"

  - name: "status reports branch on feature branch"
    command: "git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B feat-xyz && clc status 2>&1 | grep 'branch: feat-xyz'"

  - name: "status reports is_main false on feature branch"
    command: "git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B feat-xyz && clc status 2>&1 | grep 'is_main: false'"

  - name: "status reports not a git repo gracefully"
    command: "TMPD=$(mktemp -d) && cd \"$TMPD\" && clc status 2>&1 | grep -i 'no git'; RET=$?; rm -rf \"$TMPD\"; exit $RET"

  - name: "clc home fails outside a git repo"
    command: "TMPD=$(mktemp -d) && cd \"$TMPD\" && clc home 2>&1 | grep -qi 'git'; RET=$?; rm -rf \"$TMPD\"; exit $RET"

  - name: "clc home prints repo root from git repo"
    command: "git init -q -b main && test \"$(clc home)\" = \"$(pwd -P)\""

  - name: "guard allows Read on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Read\",\"tool_input\":{\"file_path\":\"/tmp/foo\"}}' | clc hook"

  - name: "guard allows Glob on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Glob\",\"tool_input\":{}}' | clc hook"

  - name: "guard allows Grep on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Grep\",\"tool_input\":{}}' | clc hook"

  - name: "guard blocks Edit on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Edit\",\"tool_input\":{}}' | clc hook 2>/dev/null; test $? -eq 2"

  - name: "guard blocks Write on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Write\",\"tool_input\":{}}' | clc hook 2>/dev/null; test $? -eq 2"

  - name: "guard blocks NotebookEdit on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"NotebookEdit\",\"tool_input\":{}}' | clc hook 2>/dev/null; test $? -eq 2"

  - name: "guard blocks Bash with non-allowlisted command on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"echo hello > file.txt\"}}' | clc hook 2>/dev/null; test $? -eq 2"

  - name: "guard allows Bash git on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"git status\"}}' | clc hook"

  - name: "guard allows Bash ls on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"ls -la\"}}' | clc hook"

  - name: "guard allows Bash cargo test on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"cargo test --workspace\"}}' | clc hook"

  - name: "guard allows Bash clc on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"clc status\"}}' | clc hook"

  - name: "guard allows Bash missouri on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"missouri run\"}}' | clc hook"

  - name: "guard blocks Bash tisket issue create on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"tisket issue create -t foo\"}}' | clc hook 2>/dev/null; test $? -eq 2"

  - name: "guard allows Bash tisket issue list on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"tisket issue list\"}}' | clc hook"

  - name: "guard allows Bash tisket issue show on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"tisket issue show foo\"}}' | clc hook"

  - name: "guard allows Bash tisket issue path on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"tisket issue path foo\"}}' | clc hook"

  - name: "guard allows Bash tisket search on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"tisket search query\"}}' | clc hook"

  - name: "guard allows Bash cargo fmt --check on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"cargo fmt --check\"}}' | clc hook"

  - name: "guard allows Bash cargo check on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"cargo check --workspace\"}}' | clc hook"

  - name: "guard allows Bash cargo build on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"cargo build --release\"}}' | clc hook"

  - name: "guard allows Bash cargo clippy on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"cargo clippy --all-targets\"}}' | clc hook"

  - name: "guard allows Bash which on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"which clc\"}}' | clc hook"

  - name: "guard allows Bash cat on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"cat Cargo.toml\"}}' | clc hook"

  - name: "guard allows Bash head on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"head -20 Cargo.toml\"}}' | clc hook"

  - name: "guard allows Bash tail on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"tail -10 Cargo.toml\"}}' | clc hook"

  - name: "guard allows Bash wc on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"wc -l src/*.rs\"}}' | clc hook"

  - name: "guard allows Bash find on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"find . -name *.rs\"}}' | clc hook"

  - name: "guard allows Bash tree on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"tree src\"}}' | clc hook"

  - name: "guard allows Bash pwd on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"pwd\"}}' | clc hook"

  - name: "CLC_GUARD_OFF bypasses Edit block on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && CLC_GUARD_OFF=1 echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Edit\",\"tool_input\":{}}' | CLC_GUARD_OFF=1 clc hook"

  - name: "CLC_GUARD_OFF bypasses Bash block on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"npm install\"}}' | CLC_GUARD_OFF=1 clc hook"

  - name: "guard blocks NotebookEdit on feature branch with no phase"
    command: "git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B feat-xyz && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"NotebookEdit\",\"tool_input\":{\"file_path\":\"notebook.ipynb\"}}' | clc hook 2>/dev/null; test $? -eq 2"

  - name: "guard allows Bash on feature branch with no phase"
    command: "git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B feat-xyz && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"cargo test\"}}' | clc hook"

  - name: "guard blocks Task on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Task\",\"tool_input\":{}}' | clc hook 2>/dev/null; test $? -eq 2"

  - name: "guard Bash block message on main mentions pickup"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"npm install\"}}' | clc hook 2>&1 >/dev/null | grep -i 'pickup'"

  - name: "guard block message mentions pickup"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Edit\",\"tool_input\":{}}' | clc hook 2>&1 >/dev/null | grep -i 'pickup'"

  - name: "guard blocks Edit on feature branch with no phase"
    command: "git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B feat-xyz && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Edit\",\"tool_input\":{\"file_path\":\"src/main.rs\"}}' | clc hook 2>/dev/null; test $? -eq 2"

  - name: "guard allows Edit in tests/missouri on feature branch with no phase"
    command: "git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B feat-xyz && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Edit\",\"tool_input\":{\"file_path\":\"tests/missouri/foo/.missouri/missouri.yml\"}}' | clc hook"

  - name: "guard blocks Write on feature branch with no phase"
    command: "git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B feat-xyz && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Write\",\"tool_input\":{\"file_path\":\"Cargo.toml\"}}' | clc hook 2>/dev/null; test $? -eq 2"

  - name: "guard allows Read on feature branch with no phase"
    command: "git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B feat-xyz && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Read\",\"tool_input\":{\"file_path\":\"src/main.rs\"}}' | clc hook"

  - name: "guard block message on no-phase feature branch mentions phase"
    command: "git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B feat-xyz && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Edit\",\"tool_input\":{\"file_path\":\"src/main.rs\"}}' | clc hook 2>&1 >/dev/null | grep -i 'phase'"

  - name: "Stop hook blocked on feature branch with no phase"
    command: "git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B feat-xyz && echo '{\"hook_event_name\":\"Stop\",\"session_id\":\"test\",\"cwd\":\".\"}' | clc hook 2>/dev/null; test $? -eq 2"

  - name: "Stop block message on no-phase feature branch mentions no phase"
    command: "git init -q -b main && git -c user.name=test -c user.email=test@test commit -q --allow-empty -m init && git checkout -q -B feat-xyz && echo '{\"hook_event_name\":\"Stop\",\"session_id\":\"test\",\"cwd\":\".\"}' | clc hook 2>&1 >/dev/null | grep -i 'No phase'"

  - name: "SessionStart on main mentions pickup"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"SessionStart\",\"session_id\":\"test\",\"cwd\":\".\",\"source\":\"startup\"}' | clc hook | jq -e '.hookSpecificOutput.additionalContext' | grep -i 'pickup'"

  - name: "status reports no phase when no state file"
    command: "! clc status 2>&1 | grep 'phase:'"

  - name: "status set without state file rejects non-first phase"
    command: "clc status set tests-written 2>&1; test $? -ne 0"

  - name: "status reports no tests when no test dir"
    command: "clc status 2>&1 | grep 'missouri: no tests'"

  - name: "status reports tisket not initialized when no tisket.yml"
    command: "clc status 2>&1 | grep 'tisket: not initialized'"

  - name: "prime exits 0"
    command: "clc prime"

  - name: "prime contains clc header"
    command: "clc prime | grep -i 'workflow'"

  - name: "prime contains tisket section"
    command: "clc prime | grep -i 'tisket'"

  - name: "prime contains missouri section"
    command: "clc prime | grep -i 'missouri'"

  - name: "prime says tisket not initialized"
    command: "clc prime | grep -i 'not initialized'"

  - name: "prime says no missouri tests"
    command: "clc prime | grep -i 'no test'"

  - name: "prime includes TDD mandate"
    command: "clc prime | grep -i 'test-driven'"

  - name: "prime TDD mandate mentions failing test first"
    command: "clc prime | grep -i 'failing test'"

  - name: "prime mentions pickup when on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && clc prime | grep -i 'pickup'"

  - name: "prime mentions clc admin when on main"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && clc prime | grep 'clc admin'"

  - name: "prime on main describes Bash as restricted to allowlist"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && clc prime | grep -i 'allowlist'"

  - name: "SessionStart on main mentions clc admin"
    command: "git init -q -b main && (git checkout main 2>/dev/null || true) && echo '{\"hook_event_name\":\"SessionStart\",\"session_id\":\"test\",\"cwd\":\".\",\"source\":\"startup\"}' | clc hook | jq -e '.hookSpecificOutput.additionalContext' | grep -i 'admin'"

  - name: "SessionStart hook additionalContext contains tisket"
    command: "echo '{\"hook_event_name\":\"SessionStart\",\"session_id\":\"test\",\"cwd\":\".\",\"source\":\"startup\"}' | clc hook | jq -r '.hookSpecificOutput.additionalContext' | grep -i 'tisket'"

  - name: "SessionStart hook additionalContext contains missouri"
    command: "echo '{\"hook_event_name\":\"SessionStart\",\"session_id\":\"test\",\"cwd\":\".\",\"source\":\"startup\"}' | clc hook | jq -r '.hookSpecificOutput.additionalContext' | grep -i 'missouri'"

  - name: "re-init over clc-only hooks succeeds without --force"
    command: "clc init"

  - name: "re-init with --force also succeeds"
    command: "clc init --force"

  - name: "clc tisket --help exits 0"
    command: "clc tisket --help"

  - name: "clc missouri --help exits 0"
    command: "clc missouri --help"

  - name: "UserPromptSubmit returns JSON with additionalContext"
    command: "echo '{\"hook_event_name\":\"UserPromptSubmit\",\"session_id\":\"test\",\"cwd\":\".\",\"prompt\":\"hello\"}' | clc hook | jq -e '.hookSpecificOutput.additionalContext'"

  - name: "UserPromptSubmit reinforcement includes tisket status"
    command: "echo '{\"hook_event_name\":\"UserPromptSubmit\",\"session_id\":\"test\",\"cwd\":\".\",\"prompt\":\"hello\"}' | clc hook | jq -r '.hookSpecificOutput.additionalContext' | grep -i 'tisket'"

  - name: "UserPromptSubmit reinforcement includes missouri status"
    command: "echo '{\"hook_event_name\":\"UserPromptSubmit\",\"session_id\":\"test\",\"cwd\":\".\",\"prompt\":\"hello\"}' | clc hook | jq -r '.hookSpecificOutput.additionalContext' | grep -i 'missouri'"

  - name: "Stop hook allowed on main"
    command: "git init -q -b main && echo '{\"hook_event_name\":\"Stop\",\"session_id\":\"test\",\"cwd\":\".\"}' | clc hook"

  - name: "PostToolUse Edit passes through when no phase"
    command: "echo '{\"hook_event_name\":\"PostToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Edit\",\"tool_input\":{},\"tool_response\":{}}' | clc hook"

  - name: "PostToolUse Read produces no output"
    command: "OUTPUT=$(echo '{\"hook_event_name\":\"PostToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Read\",\"tool_input\":{},\"tool_response\":{}}' | clc hook); test -z \"$OUTPUT\""

transitions:
  - name: "drop files in inbox and poll"
    command: "mkdir -p .clc/inbox && printf 'voice note content\n' > .clc/inbox/note.md && printf 'task description\n' > .clc/inbox/task.txt && clc inbox poll"
    target: "../inbox-polled"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc/"
          ignore: true

  - name: "write item to outbox"
    command: "printf 'hello outbox\n' | clc outbox write item.md"
    target: "../outbox-with-item"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc/"
          ignore: true

  - name: "add custom config"
    command: "printf 'main_branch: trunk\\n' > .clc/config.yml"
    target: "../has-config"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc"
          ignore: true

  - name: "add invalid config"
    command: "printf '][not valid yaml{{{\\n' > .clc/config.yml"
    target: "../has-bad-config"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc"
          ignore: true

  - name: "set initial phase"
    command: "clc status set tests-unwritten"
    target: "../phase-tests-unwritten"
    comparators:
      files:
