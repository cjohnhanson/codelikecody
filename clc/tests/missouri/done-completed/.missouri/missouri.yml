assertions:
  - name: "phase is done"
    command: "clc status 2>&1 | grep 'phase: done'"

  - name: "tisket is closed"
    command: "test -f .tisket/v0.1.0/.closed/test-feature.md"

  - name: "done committed its changes"
    command: "git log -1 --format=%s | grep -q 'clc: finalize'"

  - name: ".clc/state is not tracked by git"
    command: "! git cat-file -e HEAD:.clc/state 2>/dev/null"

  - name: "committed state includes closed tisket"
    command: "git cat-file -e HEAD:.tisket/v0.1.0/.closed/test-feature.md"

  - name: "committed state does not include open tisket"
    command: "! git cat-file -e HEAD:.tisket/v0.1.0/test-feature.md"

  - name: "working tree is clean after done"
    command: "test -z \"$(git status --porcelain -uno)\""

  - name: "done fails when already done"
    command: "clc done 2>&1; test $? -ne 0"

  - name: "Stop hook allowed in done"
    command: "echo '{\"hook_event_name\":\"Stop\",\"session_id\":\"test\",\"cwd\":\".\"}' | clc hook"

transitions:
  - name: "switch to main for merge"
    command: "git checkout -q main"
    target: "../ready-to-merge"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc/"
          ignore: true
        - path: ".git/"
          ignore: true
        - path: ".tisket/"
          ignore: true
        - path: "tisket.yml"
          ignore: true
        - path: "tests/"
          ignore: true

  - name: "switch to main and advance for diverged merge"
    command: "git checkout -q main && printf '# Changelog\\nInitial entry\\n' > CHANGELOG.md && git -c user.name=test -c user.email=test@test add CHANGELOG.md && git -c user.name=test -c user.email=test@test commit -q -m 'add changelog'"
    target: "../ready-to-merge-diverged"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc/"
          ignore: true
        - path: ".git/"
          ignore: true
        - path: ".tisket/"
          ignore: true
        - path: "tisket.yml"
          ignore: true
        - path: "tests/"
          ignore: true
