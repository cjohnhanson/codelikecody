assertions:
  - name: "clc.toml config file with coordinator section exists"
    command: "test -f clc.toml"

  - name: "config show includes coordinator section"
    command: "clc config show | grep -q 'coordinator'"

  - name: "config show includes auto_grant field"
    command: "clc config show | grep -q 'auto_grant'"

  - name: "config show includes always_escalate field"
    command: "clc config show | grep -q 'always_escalate'"

  - name: "config show includes specific auto_grant pattern Bash(cargo *)"
    command: "clc config show | grep -q 'Bash(cargo \\*)'"

  - name: "config show includes specific auto_grant pattern Bash(npm *)"
    command: "clc config show | grep -q 'Bash(npm \\*)'"

  - name: "config show includes specific always_escalate pattern Bash(rm *)"
    command: "clc config show | grep -q 'Bash(rm \\*)'"

  - name: "config show includes specific always_escalate pattern Bash(git push *)"
    command: "clc config show | grep -q 'Bash(git push \\*)'"

  - name: "config show still includes main_branch"
    command: "clc config show | grep -q 'main_branch'"
