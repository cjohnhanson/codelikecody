doc: |
  The agent can stop here. Source files are locked (test-only edits). A reviewer — human or coordinator — can pick up the review. If no review is needed, the agent advances through the remaining phases.

assertions:
  - name: "state file exists"
    command: "test -f .clc/state"

  - name: "status reports phase review-requested"
    command: "clc status 2>&1 | grep 'phase: review-requested'"

  - name: "status set to same phase is rejected"
    command: "clc status set review-requested 2>&1; test $? -ne 0"

  - name: "status set skipping to done is rejected"
    command: "clc status set done 2>&1; test $? -ne 0"

  - name: "phase guard blocks Edit on non-.rs file on feature branch"
    command: "git init -q -b main && git -c user.name=t -c user.email=t@t commit -q --allow-empty -m init && git checkout -q -B feat-xyz && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Edit\",\"tool_input\":{\"file_path\":\"Cargo.toml\"}}' | clc hook 2>/dev/null; test $? -eq 2"

  - name: "phase guard allows Edit in tests/missouri on feature branch"
    command: "git init -q -b main && (git checkout -B feat-xyz 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Edit\",\"tool_input\":{\"file_path\":\"tests/missouri/foo/.missouri/missouri.yml\"}}' | clc hook"

  - name: "phase guard allows Bash on feature branch"
    command: "git init -q -b main && (git checkout -B feat-xyz 2>/dev/null || true) && echo '{\"hook_event_name\":\"PreToolUse\",\"session_id\":\"test\",\"cwd\":\".\",\"tool_name\":\"Bash\",\"tool_input\":{\"command\":\"cargo test\"}}' | clc hook"

  - name: "Stop hook allowed in review-requested"
    command: "git init -q -b main && git -c user.name=t -c user.email=t@t commit -q --allow-empty -m init && git checkout -q -B feat-xyz && echo '{\"hook_event_name\":\"Stop\",\"session_id\":\"test\",\"cwd\":\".\"}' | clc hook"

  - name: "prime shows current phase"
    command: "clc prime | grep 'review-requested'"

transitions:
  - name: "advance to in-review"
    command: "clc status set in-review"
    target: "../phase-in-review"
    doc: |
      A reviewer is looking at the work. Source files unlock again so review feedback can be addressed.
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc"
          ignore: true

  - name: "go back to implementing"
    command: "clc status set implementing"
    target: "../phase-implementing"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc"
          ignore: true
