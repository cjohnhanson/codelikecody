[package]
name = "clc"
version = "0.2.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
almanac = { path = "../almanac", default-features = false }
belmont = { path = "../belmont" }
async-trait = "0.1"
axum = "0.8"
camino = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "6"
flate2 = "1"
sha1 = "0.10"
claude-code = { path = "../claude-code" }
clc-sdk = { path = "../clc-sdk", features = ["sqlite"] }
gix = { version = "0.80.0", default-features = false, features = [
    "index",
    "merge",
    "tree-editor",
    "status",
    "worktree-mutation",
    "blocking-network-client",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
toml = "0.8"
missouri = { path = "../missouri", default-features = false }
tisket = { path = "../tisket", default-features = false }
zettel = { path = "../zettel", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
bollard = "0.18"
futures-util = "0.3"
nix = { version = "0.31.2", features = ["signal", "fs"] }
sigpipe = "0.1.3"
russh = "0.60"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", features = ["ring"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tar = "0.4"
tempfile = "3"
walkdir = "2"
