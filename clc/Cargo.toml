[package]
name = "clc"
version = "0.1.0"
edition = "2024"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[dependencies]
almanac = { path = "../almanac", default-features = false }
camino = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
dirs = "6"
claude-code = { path = "../claude-code" }
clc-sdk = { path = "../clc-sdk", features = ["sqlite"] }
gix = { version = "0.80.0", default-features = false, features = [
    "index",
    "merge",
    "tree-editor",
    "status",
    "worktree-mutation",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yml = "0.0.12"
toml = "0.8"
missouri = { path = "../missouri", default-features = false }
tisket = { path = "../tisket", default-features = false }
zettel = { path = "../zettel", default-features = false }
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }
bollard = "0.18"
futures-util = "0.3"
nix = { version = "0.31.2", features = ["signal", "fs"] }
sigpipe = "0.1.3"

[dev-dependencies]
tempfile = "3.26.0"
