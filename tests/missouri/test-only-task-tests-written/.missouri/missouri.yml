assertions:
  - name: "test improvements exist"
    command: "test -f tests/missouri/test-state-1/.missouri/missouri.yml"

  - name: "tests directory unchanged besides new test file"
    command: "test -d tests/missouri/test-state-1"

transitions:
  - name: "add more test improvements (additional assertions)"
    command: "echo 'assertions:\\n  - name: \"extra check\"' >> tests/missouri/test-state-1/.missouri/missouri.yml && git add tests/missouri/ && git commit -m 'test: enhance test assertions'"
    target: "../test-only-task-green"
    comparators:
      files:
        - path: ".clc/"
          ignore: true
        - path: ".git/"
          ignore: true
        - path: ".tisket/"
          ignore: true
        - path: "tests/"
          ignore: false
