assertions:
  - name: ".clc directory exists"
    command: "test -d .clc"

  - name: ".claude directory exists"
    command: "test -d .claude"

  - name: "settings.local.json exists"
    command: "test -f .claude/settings.local.json"

  - name: "settings.local.json is valid JSON"
    command: "jq empty .claude/settings.local.json"

  - name: "hooks object has 14 events"
    command: "test $(jq '.hooks | keys | length' .claude/settings.local.json) -eq 14"

  - name: "SessionStart hook is wired"
    command: "jq -e '.hooks.SessionStart' .claude/settings.local.json"

  - name: "PreToolUse hook is wired"
    command: "jq -e '.hooks.PreToolUse' .claude/settings.local.json"

  - name: "Stop hook is wired"
    command: "jq -e '.hooks.Stop' .claude/settings.local.json"

  - name: "config show prints defaults when no config file"
    command: "clc config show 2>&1 | grep 'main_branch: main'"

  - name: "config show exits 0 with no config file"
    command: "clc config show"

transitions:
  - name: "add custom config"
    command: "printf 'main_branch: trunk\\n' > .clc/config.yml"
    target: "../has-config"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc"
          ignore: true

  - name: "add invalid config"
    command: "printf '][not valid yaml{{{\\n' > .clc/config.yml"
    target: "../has-bad-config"
    comparators:
      files:
        - path: ".claude/settings.local.json"
          command: "validate-settings"
        - path: ".clc"
          ignore: true
