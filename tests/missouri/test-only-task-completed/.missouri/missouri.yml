assertions:
  - name: "test improvements are persisted"
    command: "test -f tests/missouri/test-state-1/.missouri/missouri.yml"

  - name: "tisket closed state exists"
    command: "test -f .tisket/v0.1.0/.closed/test-improvement.md"

transitions:
  - name: "complete finalization"
    command: "git log --oneline | head -1"
    target: "../ready-for-merge"
    comparators:
      files:
        - path: ".clc/"
          ignore: true
        - path: ".git/"
          ignore: true
        - path: ".tisket/"
          ignore: true
