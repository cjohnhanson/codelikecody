assertions:
  - name: "test files are finalized"
    command: "test -f tests/missouri/test-state-1/.missouri/missouri.yml"

  - name: "all test content is present"
    command: "test -f tests/missouri/test-state-1/expected-file.txt"

transitions:
  - name: "prepare test changes for finalization"
    command: "git log --oneline | head -1"
    target: "../test-only-task-completed"
    comparators:
      files:
        - path: ".clc/"
          ignore: true
        - path: ".git/"
          ignore: true
        - path: ".tisket/"
          ignore: true
        - path: "tests/"
          ignore: false
