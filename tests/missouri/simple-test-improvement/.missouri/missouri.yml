assertions:
  - name: "workflow findings are documented"
    command: "test -f WORKFLOW_FINDINGS.md"

  - name: "findings file contains recommendations"
    command: "grep -q 'Recommendations' WORKFLOW_FINDINGS.md"

  - name: "findings address all questions"
    command: "grep -q 'Questions Answered' WORKFLOW_FINDINGS.md"

  - name: "conclusion is documented"
    command: "grep -q 'Conclusion' WORKFLOW_FINDINGS.md"
