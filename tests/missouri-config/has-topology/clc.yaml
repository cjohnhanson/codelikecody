workspaces:
  docker-worker:
    type: worker
    agent: opus
    isolation: docker
    docker_image: clc-worker:latest
workflows:
  standard:
    agents:
      - scope-check
      - test-quality
coordinators:
  dev:
    workspace: docker-worker
    max_workers: 1
    workflow: standard
    selector:
      label: backend
      project: v0.1.0
supervisor:
  poll_interval: 5
