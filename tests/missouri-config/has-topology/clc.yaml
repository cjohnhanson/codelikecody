workspaces:
  docker-worker:
    type: worker
    agent: opus
    isolation: docker
    image: clc-worker:latest
workflows:
  standard:
    phases:
      - name: tests-unwritten
        transitions:
          - tests-written
      - tests-written
      - done
coordinators:
  dev:
    workspace: docker-worker
    max_workers: 1
    workflow: standard
    selector:
      label: backend
      project: v0.1.0
supervisor:
  poll_interval: 5
