transitions:
  - name: "create test fixture"
    command: |
      mkdir -p fixtures
      cat > fixtures/test-page.html << 'HTMLEOF'
      <!DOCTYPE html>
      <html lang="en">
      <head><meta charset="utf-8"><title>Moose Test Page</title></head>
      <body>
        <h1>Test Page</h1>
        <p id="greeting">Hello, World!</p>
        <form id="test-form">
          <label for="name-input">Name</label>
          <input type="text" id="name-input" name="name" placeholder="Enter your name">
          <label for="email-input">Email</label>
          <input type="email" id="email-input" name="email" placeholder="Enter your email">
          <label><input type="checkbox" id="agree-checkbox" name="agree"> I agree</label>
          <button type="submit" id="submit-btn">Submit</button>
        </form>
        <nav>
          <a href="#section1" id="link-1">Section 1</a>
          <a href="#section2" id="link-2">Section 2</a>
        </nav>
        <div id="output"></div>
        <script>
          document.getElementById('test-form').addEventListener('submit', function(e) {
            e.preventDefault();
            var name = document.getElementById('name-input').value;
            document.getElementById('output').textContent = 'Submitted: ' + name;
          });
        </script>
      </body>
      </html>
      HTMLEOF
    target: "../has-page"
    comparators:
      files:
        - path: "fixtures/"
          ignore: true

  - name: "create animation test fixture"
    command: |
      mkdir -p fixtures
      cat > fixtures/animation-page.html << 'HTMLEOF'
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="utf-8"><title>Animation Test</title>
        <style>
          @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
          @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
          #spinner { width: 40px; height: 40px; border: 3px solid #ccc; border-top-color: #333; border-radius: 50%; animation: spin 1s linear infinite; }
          #hero { opacity: 0; animation: fadeIn 0.5s ease forwards; animation-delay: 0.1s; }
          .hover-btn { padding: 10px 20px; background: #333; color: white; border: none; transition: background 0.3s ease; }
        </style>
      </head>
      <body>
        <div id="spinner"></div>
        <h1 id="hero">Welcome</h1>
        <button class="hover-btn" id="action-btn">Click Me</button>
      </body>
      </html>
      HTMLEOF
    target: "../has-animations"
    comparators:
      files:
        - path: "fixtures/"
          ignore: true
