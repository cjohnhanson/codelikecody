<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Moose Animation Test</title>
  <style>
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    #spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #ccc;
      border-top-color: #333;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    #hero {
      opacity: 0;
      animation: fadeIn 0.5s ease forwards;
      animation-delay: 0.1s;
    }

    .hover-btn {
      padding: 10px 20px;
      background: #333;
      color: white;
      border: none;
      transition: background 0.3s ease, transform 0.2s ease;
      cursor: pointer;
    }

    .hover-btn:hover {
      background: #666;
      transform: scale(1.05);
    }

    #slide-in {
      transform: translateX(-100%);
      transition: transform 0.4s ease-out;
    }

    #slide-in.visible {
      transform: translateX(0);
    }
  </style>
</head>
<body>
  <div id="spinner"></div>
  <h1 id="hero">Welcome</h1>
  <button class="hover-btn" id="action-btn">Click Me</button>
  <div id="slide-in">Slide Content</div>

  <script>
    // Trigger slide-in after 200ms
    setTimeout(function() {
      document.getElementById('slide-in').classList.add('visible');
    }, 200);

    document.getElementById('action-btn').addEventListener('click', function() {
      this.textContent = 'Clicked!';
    });
  </script>
</body>
</html>
