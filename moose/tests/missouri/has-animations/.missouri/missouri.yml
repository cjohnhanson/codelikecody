assertions:
  - name: "open animation page"
    command: "moose --session anim open file://$(pwd)/fixtures/animation-page.html && sleep 0.5"

  - name: "animation list shows spinning animation"
    command: "moose --session anim animation list | grep -q 'spin'"

  - name: "animation list shows animation type"
    command: "moose --session anim animation list | grep -q 'CSSAnimation'"

  - name: "animation list shows running state"
    command: "moose --session anim animation list | grep -q 'running'"

  - name: "animation list shows duration"
    command: "moose --session anim animation list | grep -q 'duration='"

  - name: "animation list shows target element"
    command: "moose --session anim animation list | grep -q 'div#spinner'"

  - name: "animation pause freezes animations"
    command: "moose --session anim animation pause && sleep 0.2 && moose --session anim animation list | grep -q 'paused'"

  - name: "snapshot during pause captures frozen state"
    command: "moose --session anim snapshot | grep -q 'Welcome'"

  - name: "animation resume continues animations"
    command: "moose --session anim animation resume && sleep 0.2 && moose --session anim animation list | grep -q 'running'"

  - name: "animation slow changes playback rate"
    command: "moose --session anim animation slow 0.1 && sleep 0.2 && moose --session anim animation list | grep -q 'rate=0.1x'"

  - name: "animation slow 1 restores normal speed"
    command: "moose --session anim animation slow 1"

  - name: "wait animation completes on finite animation"
    command: "moose --session anim open file://$(pwd)/fixtures/animation-page.html && moose --session anim wait --animation '#hero'"

  - name: "close browser"
    command: "moose --session anim close"
