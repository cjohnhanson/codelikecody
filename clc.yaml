workspaces:
  docker:
    type: worker
    agent: opus
    isolation: docker
    docker_image: clc-worker:latest

workflows:
  tdd:
    agents:
      - scope-check
      - code-review
      - test-review
  tdd-light:
    agents:
      - scope-check
  tdd-secure:
    agents:
      - scope-check
      - code-review
      - test-review
      - security-review
  docs:
    agents:
      - scope-check
      - docs-review
  frontend:
    agents:
      - scope-check
      - code-review
      - design-review

coordinators:
  auto:
    workspace: docker
    workflow: tdd-light
    max_workers: 3
    selector:
      label: auto
      project: v0.1.0
  standard:
    workspace: docker
    workflow: tdd
    max_workers: 2
    selector:
      label: standard
      project: v0.1.0

supervisor:
  poll_interval: 10
